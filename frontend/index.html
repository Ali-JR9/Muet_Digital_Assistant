<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUET Digital Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1329; color: #f8fafc; min-height: 100vh; }
        
        /* Navigation Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #0f172a; border-bottom: 1px solid #1e293b; }
        .brand { display: flex; flex-direction: column; }
        .brand-title { font-size: 1.1rem; font-weight: bold; color: #ffffff; }
        .brand-sub { font-size: 0.8rem; color: #94a3b8; }
        nav { display: flex; gap: 1.5rem; }
        nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; cursor: pointer; }
        nav a:hover { color: #38bdf8; }

        /* Main Container */
        .container { max-width: 900px; margin: 3rem auto; padding: 0 1rem; }
        h1 { text-align: center; color: #38bdf8; font-size: 2.2rem; margin-bottom: 2rem; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 14px; font-size: 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
        input:focus { border-color: #0284c7; }
        button { padding: 14px 28px; font-size: 16px; border-radius: 8px; border: none; background: #0284c7; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        
        /* Response Container */
        .result-box { background: #1e293b; padding: 25px; border-radius: 10px; border: 1px solid #334155; min-height: 150px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.7; font-size: 15px; color: #e2e8f0; }

        /* Modal Overlays */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #334155; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 22px; cursor: pointer; color: #94a3b8; }
        .close-btn:hover { color: #fff; }
        .history-list { list-style: none; max-height: 250px; overflow-y: auto; margin-top: 15px; }
        .history-item { padding: 10px; border-bottom: 1px solid #334155; cursor: pointer; font-size: 14px; color: #38bdf8; }
        .history-item:hover { background: #0f172a; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-title">Mehran UET</span>
            <span class="brand-sub">Jamshoro, Pakistan</span>
        </div>
        <nav>
            <a id="navNewSearch">New Search</a>
            <a id="navHistory">History</a>
            <a id="navAbout">About</a>
            <a id="navContact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>MUET Digital Assistant</h1>
        <div class="search-box">
            <input type="text" id="queryInput" placeholder="Ask any question about MUET prospectus...">
            <button id="searchBtn">Search</button>
        </div>
        <div class="result-box" id="resultOutput">Ask any question above to search the prospectus database.</div>
    </div>

    <!-- Modal Dialog -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle" style="color: #38bdf8; margin-bottom: 15px;">Title</h2>
            <div id="modalBody" style="line-height: 1.6; font-size: 14px; color: #cbd5e1;">Body content</div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
